name: Cross-Compile Docker Build and Push

on:
  release:
    types: [published]
  push:
    branches:
      - fix-docker-GA
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/zargarzadehm/oracle-core

jobs:
 build:
   runs-on: ubuntu-latest
   strategy:
     matrix:
       include:
         - platform: 'linux/amd64'
           ccarch: 'x86_64'
         - platform: 'linux/arm64'
           ccarch: 'aarch64'

   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up QEMU
       uses: docker/setup-qemu-action@v3

     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Prepare
       run: |
         platform=${{ matrix.platform }}
         echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

     - name: Generate Docker metadata
       id: metadata
       uses: docker/metadata-action@v5
       with:
          images: ghcr.io/zargarzadehm/oracle-core
           
     - name: Login to DockerHub
       uses: docker/login-action@v3
       with:
          registry: ghcr.io
          username: zargarzadehm
          password: ${{ secrets.GITHUB_TOKEN }}

     - name: Build and push by digest
       id: build
       uses: docker/build-push-action@v6
       with:
         context: .
         platforms: ${{ matrix.platform }}
         tags: ${{ env.REGISTRY_IMAGE }}
         labels: ${{ steps.metadata.outputs.labels }}
         outputs: type=image,push-by-digest=true,name-canonical=true,push=true
         build-args: |
           TARGETPLATFORM=${{ matrix.platform }}
           CCARCH=${{ matrix.ccarch }}

     - name: Export digest
       run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
     # - name: Export digest
     #   run: |
     #      mkdir -p /tmp/digests
     #      digest="${{ steps.build.outputs.digest }}"
     #      touch "/tmp/digests/${digest#sha256:}"
          
     - name: Upload digest
       uses: actions/upload-artifact@v4
       with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

     - name: check digests
       run: |
          ls -la ${{ runner.temp }}/digests/
          
 merge:
   needs: build
   runs-on: ubuntu-latest
   steps:
     - name: Download digests
       uses: actions/download-artifact@v4
       with:
         path: ${{ runner.temp }}/digests
         pattern: digests-*
         merge-multiple: true

     - name: check digests
       run: |
        ls -la ${{ runner.temp }}/digests
         
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
       
     - name: Generate Docker metadata
       id: metadata
       uses: docker/metadata-action@v5
       with:
         images: ${{ env.REGISTRY_IMAGE }}
         flavor: |
           latest=true
         
     - name: Login to DockerHub
       uses: docker/login-action@v3
       with:
          registry: ghcr.io
          username: zargarzadehm
          password: ${{ secrets.GITHUB_TOKEN }}

     - name: Create manifest list and push
       working-directory: ${{ runner.temp }}/digests
       run: |
          echo $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

     - name: Inspect image
       run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

     # - name: Create manifest list and push
     #   working-directory: /tmp/digests
     #   run: |
     #     docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
     #       $(printf 'ghcr.io/zargarzadehm/oracle-core@sha256:%s ' *)
     # - name: Inspect image
     #   run: |
     #     docker buildx imagetools inspect ghcr.io/zargarzadehm/oracle-core:${{ steps.metadata.outputs.version }}
